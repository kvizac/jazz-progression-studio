<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15171c" />
    <meta name="description" content="Compose jazz and neo-soul phrases, edit voicings, play sampled piano, and export the same performance as MIDI." />
    <title>Jazz Progression Studio · Producer Edition v6.0.1</title>
    <script type="module" crossorigin src="./assets/studio-GFG81QtV.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/studio-xl1wTuly.css">
  </head>
  <body>
    <div id="root"><div style="max-width:560px;margin:12vh auto;padding:24px;font:16px system-ui;color:#e5e8ed;background:#191c21;border-radius:8px"><h1 style="font-size:24px">Jazz Progression Studio</h1><p id="boot-status">Loading v6.0.1…</p><p id="boot-detail" style="overflow-wrap:anywhere"></p><button onclick="location.reload()" style="padding:10px 16px">Reload</button><noscript><p>JavaScript must be enabled to open the studio.</p></noscript></div></div>
    <script>
      (function () {
        function report(message) {
          var status = document.getElementById('boot-status');
          var detail = document.getElementById('boot-detail');
          if (status) status.textContent = 'The studio could not finish loading.';
          if (detail) detail.textContent = message || 'Reload the page. If this continues, send a screenshot of this message.';
        }
        window.addEventListener('error', function (event) {
          report(event.message || 'An application file could not load. Please reload the page.');
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          report(event.reason && event.reason.message || 'The application could not start. Please reload the page.');
        });
        setTimeout(function () { if (document.getElementById('boot-status')) report('Loading took too long. Please reload the page.'); }, 15000);
      }());
    </script>
  </body>
</html>
